[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "securecharge"
version = "2.1.0"
description = "MD5-to-SHA-3 integrity migration for legacy EV charging (OCPP 1.6)"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["ocpp==2.1.0", "jsonschema==4.25.1", "websockets==15.0.1"]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50,<2", "pandas>=2.2,<3"]
research = ["matplotlib>=3.10,<4"]
paper = ["reportlab>=4,<6", "pymupdf>=1.26,<2"]
pilot = ["cryptography>=46,<49"]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.13,<1", "cryptography>=46,<49"]

[project.scripts]
securecharge = "securecharge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
packages = ["securecharge"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
